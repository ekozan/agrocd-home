apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crowdsec
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  source:
    chart: crowdsec
    repoURL: https://crowdsecurity.github.io/helm-charts
    targetRevision: 0.24.3
    helm:
      releaseName: crowdsec
      valuesObject:
      
        container_runtime: containerd

        config:
          parsers:
            s02-enrich:
              # Pairs NetBird (VPN overlay, plage CGNAT 100.64.0.0/10) : appareils
              # authentifiés de l'admin. Leur trafic ne doit produire AUCUNE
              # décision (ex. custom/http-401-bf déclenché par des 401 Zitadel
              # légitimes → ban de l'admin sur idp.ffd.link). Pas de filtre :
              # s'applique à toutes les sources de logs.
              netbird-whitelist.yaml: |
                name: my/netbird-whitelist
                description: "Whitelist des pairs NetBird (VPN overlay de confiance)"
                whitelist:
                  reason: "NetBird overlay (100.64.0.0/10) — appareils de confiance"
                  cidr:
                    - "100.64.0.0/10"
              matrix-whitelist.yaml: |
                name: my/matrix-whitelist
                description: "Whitelist Matrix/Synapse requests from Traefik logs"
                filter: "evt.Meta.service == 'http' && evt.Meta.log_type == 'http_access-log'"
                whitelist:
                  reason: "Matrix federation/client traffic"
                  expression:
                    - "evt.Meta.http_path startsWith '/_matrix/'"
                    - "evt.Meta.http_path startsWith '/_synapse/'"
                    - "evt.Meta.http_path startsWith '/.well-known/matrix/'"
              office-whitelist.yaml: |
                name: my/office-whitelist
                description: "Évite les faux positifs (crawl/probing) sur le trafic légitime OxiCloud (sync Nextcloud/ownCloud) et Euro-Office (éditeur collaboratif)"
                filter: "evt.Meta.service == 'http' && evt.Meta.log_type == 'http_access-log'"
                whitelist:
                  reason: "OxiCloud sync + Euro-Office document server (trafic applicatif légitime à fort volume)"
                  # Les 401/403 NE sont PAS whitelistés → la détection brute-force
                  # (custom/http-401-bf) reste active sur l'auth.
                  expression:
                    # OxiCloud — protocole de synchro compatible Nextcloud/ownCloud
                    - "(evt.Meta.http_path startsWith '/remote.php/' || evt.Meta.http_path startsWith '/ocs/' || evt.Meta.http_path == '/status.php') && evt.Meta.http_status != '401' && evt.Meta.http_status != '403'"
                    # Euro-Office — assets et API du document server (fork OnlyOffice)
                    - "(evt.Meta.http_path startsWith '/web-apps/' || evt.Meta.http_path startsWith '/sdkjs/' || evt.Meta.http_path startsWith '/fonts/' || evt.Meta.http_path startsWith '/coauthoring/' || evt.Meta.http_path startsWith '/hosting/' || evt.Meta.http_path startsWith '/cache/' || evt.Meta.http_path == '/healthcheck') && evt.Meta.http_status != '401' && evt.Meta.http_status != '403'"
          scenarios:
            http-401-bf.yaml: |
              type: leaky
              name: custom/http-401-bf
              description: "Répétition de HTTP 401 depuis une IP (bruteforce)"
              filter: "evt.Meta.service == 'http' && evt.Meta.http_status == '401'"
              groupby: "evt.Meta.source_ip"
              capacity: 5
              leakspeed: "1m"
              blackhole: 5m
              labels:
                service: http
                type: bruteforce
                remediation: true
        # Secret fourni par external-secrets (init/01-crowdsec-secret.yaml)
        # plutôt que randomisé par le chart → render déterministe sous ArgoCD.
        # Seul `registrationToken` sert : l'agent s'auto-enregistre auprès du
        # LAPI OPNsense avec ce jeton (cscli lapi register), qui doit donc être
        # identique au `auto_registration.token` de l'OPNsense.
        secrets:
          externalSecret:
            # Jeton d'auto-enregistrement (OpenBao → 01-crowdsec-secret.yaml)
            name: crowdsec-agent-registration
        # LAPI hébergé sur le pare-feu OPNsense (plugin os-crowdsec) → plus de LAPI
        # dans le cluster. Les décisions (bans) y sont centralisées et appliquées
        # aussi au niveau pare-feu ; les profils de remédiation (ban 12h
        # brute-force, 4h par défaut) se configurent côté OPNsense — cf. README,
        # section « CrowdSec — LAPI sur OPNsense ».
        lapi:
          enabled: false
        # AppSec (WAF) retiré : il était sur le chemin de CHAQUE requête
        # (crowdsecAppsecUnreachableBlock → tout le trafic bloqué s'il tombait)
        # et rien ne le remplace côté OPNsense. Seuls restent l'agent (détection
        # sur les logs Traefik) et le bouncer Traefik (décisions du LAPI).
        appsec:
          enabled: false
        # Agent : DaemonSet qui parse les logs des pods et détecte les comportements
        agent:
          # DaemonSet sur TOUS les nœuds → l'agent est co-localisé avec Traefik
          # où qu'il tourne (il lit ses access logs via hostPath /var/log du nœud).
          # Prérequis : que le pod agent puisse se scheduler partout → requests
          # minimales (DaemonSet : la réservation est multipliée par le nombre
          # de nœuds).
          lapiURL: http://10.5.0.1:8080
          lapiHost: 10.5.0.1
          lapiPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 250Mi
          # Collections de parsers/scénarios installées au démarrage
          env:
            - name: COLLECTIONS
              value: "crowdsecurity/traefik crowdsecurity/base-http-scenarios crowdsecurity/http-cve"
          # Sources de logs : access logs des pods Traefik 3
          acquisition:
            - namespace: traefik
              podName: traefik3-*
              program: traefik
          persistentVolume:
            config:
              enabled: false
  destination:
    server: "https://kubernetes.default.svc"
    namespace: crowdsec
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      # Secret d'enregistrement fourni par external-secrets → render déterministe
      selfHeal: true
