# Middlewares Traefik réutilisables, posés dans le namespace `traefik`
# (comme le middleware `crowdsec`). Référençables depuis n'importe quel
# Ingress/IngressRoute grâce à `allowCrossNamespace: true` (cf. 00-traefik3.yaml) :
#
#   traefik.ingress.kubernetes.io/router.middlewares: traefik-local-only@kubernetescrd
#   traefik.ingress.kubernetes.io/router.middlewares: traefik-oidc-auth@kubernetescrd
#
# Les middlewares se chaînent ; ex. CrowdSec + accès local uniquement :
#   ...router.middlewares: traefik-crowdsec@kubernetescrd,traefik-local-only@kubernetescrd
---
# Bouncer CrowdSec (plugin maxlerebourg/crowdsec-bouncer-traefik-plugin v1.6.0).
#
# Ces deux middlewares étaient auparavant créés AU RUNTIME par le Job PostSync
# crowdsec-bouncer-register (kubectl apply), donc absents de Git : une fois
# supprimés du cluster, rien ne les recréait (hook exécuté seulement lors d'une
# sync effective de clusterinit, et les hooks sont exclus du diff ArgoCD).
# Ils sont désormais déclaratifs ; seule la clé du bouncer reste hors Git : elle
# est lue au runtime par Traefik dans le Secret traefik/crowdsec-bouncer-key
# (syntaxe urn:k8s:secret:<secret>:<clé>, Secret dans le même namespace que le
# Middleware), Secret alimenté par le Job crowdsec-bouncer-register (hook Sync
# wave 2, donc toujours AVANT ces Middlewares en wave 3).
#
# Stream LAPI (mode stream) :
#  - httpTimeoutSeconds (défaut 10) : le GET /v1/decisions/stream?startup=true
#    renvoie TOUTES les décisions (blocklists communautaires/Console incluses) et
#    ne se lisait plus en 10 s (« crowdsecQuery:readBody context deadline
#    exceeded »). ⚠️ Ce délai s'applique AUSSI aux appels AppSec : on reste donc
#    raisonnable, et sous updateIntervalSeconds (60 s) pour ne jamais lancer deux
#    téléchargements complets en parallèle (le plugin fait `go work()` à chaque tick).
#  - updateMaxFailure (défaut 0) : au 1er échec, le plugin passe
#    isCrowdsecStreamHealthy=false et renvoie 403 TECHNICAL_ISSUE à TOUT le monde
#    (fail-closed), puis ne redemande plus que des flux complets (startup=true),
#    les plus lents → cercle vicieux, jamais rétabli. -1 = fail-open : en cas
#    d'échec, les décisions déjà en cache restent appliquées et le trafic passe.
#    Les blocages AppSec (WAF inband) restent actifs.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: crowdsec
  namespace: traefik
  annotations:
    # Wave 3 : après le Job crowdsec-bouncer-register (hook Sync, wave 2) qui
    # publie le Secret crowdsec-bouncer-key lu ci-dessous.
    argocd.argoproj.io/sync-wave: "3"
spec:
  # WAF strict (corps entier inspecté), appliqué à TOUS les services publics.
  plugin:
    crowdsec:
      enabled: "true"
      logLevel: INFO
      # Page HTML servie aux IP bannies (montée via le chart Traefik)
      banHTMLFilePath: /etc/traefik/crowdsec/ban.html
      crowdsecMode: stream
      httpTimeoutSeconds: "45"
      updateIntervalSeconds: "60"
      updateMaxFailure: "-1"
      crowdsecLapiScheme: http
      crowdsecLapiHost: crowdsec-service.crowdsec.svc.cluster.local:8080
      crowdsecLapiKey: "urn:k8s:secret:crowdsec-bouncer-key:apiKey"
      crowdsecAppsecEnabled: "true"
      crowdsecAppsecHost: crowdsec-appsec-service.crowdsec.svc.cluster.local:7422
      crowdsecAppsecScheme: http
      crowdsecAppsecFailureBlock: "true"
      crowdsecAppsecUnreachableBlock: "true"
---
# Identique à `crowdsec` + plafond d'inspection du corps AppSec
# (crowdsecAppsecBodyLimit = 10 Mo). Réservé aux services à gros uploads
# (OxiCloud) : sans plafond, le plugin transmet TOUT le corps à l'AppSec, qui
# rejette au-delà de sa limite. 10 Mo inspectés (en-têtes + début de requête =
# là où sont les attaques) ; au-delà, le corps streame vers le backend sans
# inspection WAF. Relaxation confinée à OxiCloud (fichiers = blobs opaques).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: crowdsec-largebody
  namespace: traefik
  annotations:
    # Wave 3 : après le Job crowdsec-bouncer-register (hook Sync, wave 2) qui
    # publie le Secret crowdsec-bouncer-key lu ci-dessous.
    argocd.argoproj.io/sync-wave: "3"
spec:
  plugin:
    crowdsec:
      enabled: "true"
      logLevel: INFO
      banHTMLFilePath: /etc/traefik/crowdsec/ban.html
      crowdsecMode: stream
      httpTimeoutSeconds: "45"
      updateIntervalSeconds: "60"
      updateMaxFailure: "-1"
      crowdsecLapiScheme: http
      crowdsecLapiHost: crowdsec-service.crowdsec.svc.cluster.local:8080
      crowdsecLapiKey: "urn:k8s:secret:crowdsec-bouncer-key:apiKey"
      crowdsecAppsecEnabled: "true"
      crowdsecAppsecHost: crowdsec-appsec-service.crowdsec.svc.cluster.local:7422
      crowdsecAppsecScheme: http
      crowdsecAppsecFailureBlock: "false"
      crowdsecAppsecUnreachableBlock: "true"
      crowdsecAppsecBodyLimit: "10485760"
---
# Restreint l'accès aux réseaux locaux 10.10.x.x et 10.5.x.x.
# Traefik est exposé en LoadBalancer avec externalTrafficPolicy: Local
# (cf. 00-traefik3.yaml) → l'IP source réelle du client est préservée, donc
# ipAllowList voit la vraie IP sans avoir besoin d'ipStrategy/depth.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: local-only
  namespace: traefik
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ipAllowList:
    sourceRange:
      - 10.10.0.0/16
      - 10.5.0.0/16
---
# Credentials OIDC du client Traefik, sourcés depuis OpenBao (convention du repo).
# Flux PKCE → client public, AUCUN client_secret n'est nécessaire.
# À renseigner dans OpenBao sous kv/kubernetes/traefik/zitadel :
#   - client_id      : ID du client OIDC (type PKCE) créé dans Zitadel
#   - plugin_secret  : clé d'au moins 32 caractères pour chiffrer le cookie de session
#
# SkipDryRunOnMissingResource : la CRD ExternalSecret provient de la couche infra
# (external-secrets). Au premier bootstrap elle peut ne pas encore exister ; on
# évite l'échec du dry-run ArgoCD, le retry/selfHeal réconcilie une fois infra prête.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: traefik-oidc
  namespace: traefik
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: traefik-oidc-secret
    creationPolicy: Owner
  data:
    - secretKey: clientId
      remoteRef:
        key: kubernetes/traefik/zitadel
        property: client_id
    - secretKey: pluginSecret
      remoteRef:
        key: kubernetes/traefik/zitadel
        property: plugin_secret
---
# Login OIDC via Zitadel (plugin sevensolutions/traefik-oidc-auth, déclaré dans
# 00-traefik3.yaml). Les valeurs sensibles sont résolues au runtime par Traefik
# depuis le Secret traefik-oidc-secret via la syntaxe urn:k8s:secret:<name>:<key>
# (le Secret doit être dans le même namespace que le Middleware → traefik).
#
# Côté Zitadel : créer une application OIDC de type "PKCE" (code flow + PKCE,
# client public sans secret) et déclarer l'URL de redirection
# https://<host-protégé>/oidc/callback pour chaque hôte protégé par ce middleware.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oidc-auth
  namespace: traefik
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  plugin:
    traefik-oidc-auth:
      LogLevel: INFO
      # Clé de chiffrement du cookie de session (>= 32 caractères)
      Secret: "urn:k8s:secret:traefik-oidc-secret:pluginSecret"
      Provider:
        Url: "https://idp.ffd.link"
        ClientId: "urn:k8s:secret:traefik-oidc-secret:clientId"
        # Flux PKCE → client public, pas de ClientSecret
        UsePkce: true
      Scopes:
        - openid
        - profile
        - email
