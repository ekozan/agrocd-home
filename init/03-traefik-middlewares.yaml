# Middlewares Traefik réutilisables, posés dans le namespace `traefik`
# (comme le middleware `crowdsec`). Référençables depuis n'importe quel
# Ingress/IngressRoute grâce à `allowCrossNamespace: true` (cf. 00-traefik3.yaml) :
#
#   traefik.ingress.kubernetes.io/router.middlewares: traefik-local-only@kubernetescrd
#   traefik.ingress.kubernetes.io/router.middlewares: traefik-oidc-auth@kubernetescrd
#
# Les middlewares se chaînent ; ex. CrowdSec + accès local uniquement :
#   ...router.middlewares: traefik-crowdsec@kubernetescrd,traefik-local-only@kubernetescrd
---
# Bouncer CrowdSec (plugin maxlerebourg/crowdsec-bouncer-traefik-plugin v1.6.0).
#
# Applique les décisions (bans) du LAPI hébergé sur le pare-feu OPNsense
# (10.5.0.1:8080, plugin os-crowdsec) : blocklists communautaires + alertes de
# l'agent CrowdSec du cluster (logs Traefik) + détections propres de l'OPNsense.
# Plus d'AppSec (WAF) : le bouncer ne dépend plus d'aucun pod du cluster.
#
# Clé API : Secret traefik/crowdsec-bouncer-apikey, synchronisé depuis OpenBao
# par external-secrets (02-crowdsec-bouncer.yaml), lu au runtime par Traefik
# (urn:k8s:secret:<secret>:<clé>, Secret dans le namespace du Middleware).
# Wave 0, comme l'ExternalSecret : ces Middlewares ne dépendent PLUS de la
# santé de l'Application crowdsec (wave 1). Avant, ils étaient en wave 3 : un
# agent CrowdSec en crash bloquait la sync de clusterinit et les Middlewares
# n'étaient jamais recréés → 404 sur toutes les routes (incident 2026-11-21).
#
# Stream LAPI (mode stream) :
#  - httpTimeoutSeconds (défaut 10) : le GET /v1/decisions/stream?startup=true
#    renvoie TOUTES les décisions (blocklists communautaires/Console incluses) et
#    ne se lisait plus en 10 s (« crowdsecQuery:readBody context deadline
#    exceeded »). On reste sous updateIntervalSeconds (60 s) pour ne jamais
#    lancer deux téléchargements complets en parallèle.
#  - updateMaxFailure (défaut 0) : au 1er échec, le plugin passe
#    isCrowdsecStreamHealthy=false et renvoie 403 TECHNICAL_ISSUE à TOUT le monde
#    (fail-closed), puis ne redemande plus que des flux complets (startup=true),
#    les plus lents → cercle vicieux, jamais rétabli. -1 = fail-open : en cas
#    d'échec (OPNsense injoignable), les décisions déjà en cache restent
#    appliquées et le trafic passe.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: crowdsec
  namespace: traefik
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  plugin:
    crowdsec:
      enabled: "true"
      logLevel: INFO
      # Page HTML servie aux IP bannies (montée via le chart Traefik)
      banHTMLFilePath: /etc/traefik/crowdsec/ban.html
      crowdsecMode: stream
      httpTimeoutSeconds: "45"
      updateIntervalSeconds: "60"
      updateMaxFailure: "-1"
      crowdsecLapiScheme: http
      crowdsecLapiHost: 10.5.0.1:8080
      crowdsecLapiKey: "urn:k8s:secret:crowdsec-bouncer-apikey:apiKey"
---
# ⚠️ Alias TEMPORAIRE de `crowdsec`, à supprimer une fois OxiCloud resynchronisé.
# Il plafonnait l'inspection du corps par l'AppSec (gros uploads) ; sans AppSec
# il n'a plus de raison d'être. OxiCloud référence désormais `crowdsec`, mais
# l'app infra (OxiCloud) et clusterinit (ce fichier) se synchronisent
# séparément : le supprimer dans le même commit ferait répondre 404 à
# cloud.ffd.link entre les deux syncs.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: crowdsec-largebody
  namespace: traefik
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  plugin:
    crowdsec:
      enabled: "true"
      logLevel: INFO
      banHTMLFilePath: /etc/traefik/crowdsec/ban.html
      crowdsecMode: stream
      httpTimeoutSeconds: "45"
      updateIntervalSeconds: "60"
      updateMaxFailure: "-1"
      crowdsecLapiScheme: http
      crowdsecLapiHost: 10.5.0.1:8080
      crowdsecLapiKey: "urn:k8s:secret:crowdsec-bouncer-apikey:apiKey"
---
# Restreint l'accès aux réseaux locaux 10.10.x.x et 10.5.x.x, et aux pairs du
# VPN NetBird (100.64.0.0/10, plage CGNAT de l'overlay).
# Traefik est exposé en LoadBalancer avec externalTrafficPolicy: Local
# (cf. 00-traefik3.yaml) → l'IP source réelle du client est préservée, donc
# ipAllowList voit la vraie IP sans avoir besoin d'ipStrategy/depth.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: local-only
  namespace: traefik
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ipAllowList:
    sourceRange:
      - 10.10.0.0/16
      - 10.5.0.0/16
      - 100.64.0.0/10
---
# Variante de local-only pour les hôtes appelés depuis le cluster (ex.
# openbao.ffd.link, utilisé par External Secrets) : ajoute le CIDR des pods
# (défaut k3s/RKE2, cf. NB_PROXY_TRUSTED_PROXIES dans infra/netbird/proxy.yaml ;
# à vérifier avec `kubectl get nodes -o jsonpath='{.items[*].spec.podCIDR}'`).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: local-only-cluster
  namespace: traefik
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ipAllowList:
    sourceRange:
      - 10.10.0.0/16
      - 10.5.0.0/16
      - 100.64.0.0/10
      - 10.42.0.0/16
---
# Credentials OIDC du client Traefik, sourcés depuis OpenBao (convention du repo).
# Flux PKCE → client public, AUCUN client_secret n'est nécessaire.
# À renseigner dans OpenBao sous kv/kubernetes/traefik/zitadel :
#   - client_id      : ID du client OIDC (type PKCE) créé dans Zitadel
#   - plugin_secret  : clé d'au moins 32 caractères pour chiffrer le cookie de session
#
# SkipDryRunOnMissingResource : la CRD ExternalSecret provient de la couche infra
# (external-secrets). Au premier bootstrap elle peut ne pas encore exister ; on
# évite l'échec du dry-run ArgoCD, le retry/selfHeal réconcilie une fois infra prête.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: traefik-oidc
  namespace: traefik
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: traefik-oidc-secret
    creationPolicy: Owner
  data:
    - secretKey: clientId
      remoteRef:
        key: kubernetes/traefik/zitadel
        property: client_id
    - secretKey: pluginSecret
      remoteRef:
        key: kubernetes/traefik/zitadel
        property: plugin_secret
---
# Login OIDC via Zitadel (plugin sevensolutions/traefik-oidc-auth, déclaré dans
# 00-traefik3.yaml). Les valeurs sensibles sont résolues au runtime par Traefik
# depuis le Secret traefik-oidc-secret via la syntaxe urn:k8s:secret:<name>:<key>
# (le Secret doit être dans le même namespace que le Middleware → traefik).
#
# Côté Zitadel : créer une application OIDC de type "PKCE" (code flow + PKCE,
# client public sans secret) et déclarer l'URL de redirection
# https://<host-protégé>/oidc/callback pour chaque hôte protégé par ce middleware.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oidc-auth
  namespace: traefik
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  plugin:
    traefik-oidc-auth:
      LogLevel: INFO
      # Clé de chiffrement du cookie de session (>= 32 caractères)
      Secret: "urn:k8s:secret:traefik-oidc-secret:pluginSecret"
      Provider:
        Url: "https://idp.ffd.link"
        ClientId: "urn:k8s:secret:traefik-oidc-secret:clientId"
        # Flux PKCE → client public, pas de ClientSecret
        UsePkce: true
      Scopes:
        - openid
        - profile
        - email
