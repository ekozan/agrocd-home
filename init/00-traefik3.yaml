apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik3
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  source:
    chart: traefik
    repoURL: https://traefik.github.io/charts
    targetRevision: 41.0.2
    helm:
      releaseName: traefik3
      valuesObject:
        # Logs d'accès requis pour que l'agent CrowdSec parse le trafic.
        # ⚠️ Chart >= 41 : `logs.access.*` est devenu `accessLog.*` (BREAKING
        # CHANGE traefik-helm-chart#1887). Le schéma du chart refuse toute clé
        # racine inconnue → avec l'ancienne clé `logs`, `helm template` échoue
        # (« Additional property logs is not allowed ») et l'Application reste
        # en Unknown/ComparisonError : plus AUCUN changement de cette
        # Application n'atteint le cluster (bloqué sur le chart 40.3.0).
        accessLog:
          enabled: true
        # Page de ban CrowdSec (ConfigMap crowdsec-ban-page) montée dans le
        # conteneur Traefik → /etc/traefik/crowdsec/ban.html, référencée par
        # le middleware crowdsec via banHTMLFilePath.
        volumes:
          - name: crowdsec-ban-page
            mountPath: /etc/traefik/crowdsec
            type: configMap
        service:
            spec:
              type: LoadBalancer
              ipFamilyPolicy: PreferDualStack
              externalTrafficPolicy: Local
        ingressClass:  # @schema additionalProperties: false
          enabled: true
          isDefaultClass: true
          name: "traefik"
        providers:               
          kubernetesCRD:
            # Autorise les Ingress des autres namespaces à référencer le
            # middleware crowdsec (traefik-crowdsec@kubernetescrd)
            allowCrossNamespace: true
        experimental:
          abortOnPluginFailure: false
          fastProxy:
            enabled: false
            debug: false
          kubernetesGateway:
            enabled: false
          plugins:
            traefik-oidc-auth:
              moduleName: "github.com/sevensolutions/traefik-oidc-auth"
              version: "v0.20.1"
            crowdsec:
              moduleName: "github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
              version: "v1.6.0"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: traefik
  # Sync policy
  syncPolicy:
    # Pod Security Admission — phase A : inventaire sans blocage (warn + audit)
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: false
