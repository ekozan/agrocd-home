# Namespace + jeton d'auto-enregistrement des agents CrowdSec auprès du LAPI
# hébergé sur le pare-feu OPNsense (10.5.0.1:8080).
#
# Le jeton vit dans OpenBao (convention du repo) et est synchronisé par
# external-secrets ; plus aucun Job de génération. Valeur à placer dans
# kv/kubernetes/crowdsec/opnsense, propriété `registration_token` : c'est le
# `api.server.auto_registration.token` de l'OPNsense (cf. README, section
# « CrowdSec — LAPI sur OPNsense »).
#
# Le chart le consomme via secrets.externalSecret.name (clé registrationToken).
# csLapiSecret n'est lu que par un LAPI dans le cluster (désactivé) : inutile.
---
apiVersion: v1
kind: Namespace
metadata:
  name: crowdsec
  labels:
    # Pod Security Admission — phase A : inventaire sans blocage (warn + audit).
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# SkipDryRunOnMissingResource : la CRD ExternalSecret provient de la couche
# infra (external-secrets) ; au premier bootstrap elle peut ne pas exister.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-agent-registration
  namespace: crowdsec
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: crowdsec-agent-registration
    creationPolicy: Owner
  data:
    - secretKey: registrationToken
      remoteRef:
        key: kubernetes/crowdsec/opnsense
        property: registration_token
