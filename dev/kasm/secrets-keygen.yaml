---
# Bootstrap du Secret "kasm-secrets" (tokens manager/service, mots de passe DB,
# admin@kasm.local et user@kasm.local). Un Job le génère UNE SEULE FOIS s'il
# n'existe pas. Le Secret n'est pas géré par Git/ArgoCD : il n'est jamais pruné
# ni régénéré tant qu'on ne le supprime pas manuellement.
# Récupérer le mot de passe admin :
#   kubectl -n kasm get secret kasm-secrets -o jsonpath='{.data.admin-password}' | base64 -d
#
# Hooks PreSync : doivent passer avant les hooks Helm du chart (pre-install →
# PreSync) et avant le Job db-init qui lit ce Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kasm-keygen
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-30"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kasm-keygen
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-30"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kasm-keygen
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-30"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kasm-keygen
subjects:
  - kind: ServiceAccount
    name: kasm-keygen
    namespace: kasm
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kasm-keygen
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-20"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: kasm-keygen
    spec:
      serviceAccountName: kasm-keygen
      priorityClassName: homelab-low
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keygen
          image: alpine/kubectl:1.36.3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # HOME inscriptible pour le cache kubectl (rootfs en lecture seule)
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              if kubectl get secret kasm-secrets -n kasm >/dev/null 2>&1; then
                echo "Secret kasm-secrets déjà présent — rien à faire."
                exit 0
              fi
              gen() { LC_ALL=C tr -dc 'A-Za-z0-9' </dev/urandom | head -c 26; }
              kubectl create secret generic kasm-secrets -n kasm \
                --from-literal=manager-token="$(gen)" \
                --from-literal=service-token="$(gen)" \
                --from-literal=db-password="$(gen)" \
                --from-literal=admin-password="$(gen)" \
                --from-literal=user-password="$(gen)"
              echo "Secret kasm-secrets généré."
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
