# Agent Claude Code interactif : Session persistante utilisable depuis la
# Kelos Console (kelos.proxy.ffd.link, via NetBird) ou `kelos session connect`.
#
# Une Session = un dépôt (Workspace). Pour un autre dépôt GitHub : ajouter un
# Workspace (ici ou depuis la page Admin de la Console) avec
# `secretRef: github-token`, puis créer une Session depuis la Console.
#
# ⚠️ Le spec d'une Session est presque entièrement immuable (workspaceRef,
# agentConfigRefs, initialBranch, volumeClaimTemplate…) : pour le changer,
# créer une nouvelle Session (nouveau nom). Modifiables : credentials, model,
# suspend, idlePolicy, podOverrides.
#
# Wave 1 : après les CRDs et le contrôleur du chart (wave 0).
---
apiVersion: kelos.dev/v1alpha2
kind: Workspace
metadata:
  name: agrocd-home
  namespace: kelos-agents
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  repo: https://github.com/ekozan/agrocd-home.git
  ref: main
  secretRef:
    name: github-token
---
apiVersion: kelos.dev/v1alpha2
kind: AgentConfig
metadata:
  name: claude-homelab
  namespace: kelos-agents
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # Ajouté à ~/.claude/CLAUDE.md, en plus des fichiers d'instructions du dépôt.
  agentsMD: |
    # Règles de travail

    - Réponds en français.
    - Ne pousse jamais directement sur `main` (ni sur la branche par défaut) :
      travaille sur une branche dédiée et ouvre une pull request avec `gh pr create`.
      Sur agrocd-home, `main` est déployé automatiquement par ArgoCD.
    - N'écris jamais de secret (token, mot de passe, clé) dans un fichier
      commité : les dépôts peuvent être publics. Les secrets vivent dans OpenBao.
    - Avant de pousser, relis le diff et lance les vérifications rapides
      disponibles (lint, validation YAML, tests).
    - Économise les tokens : applique les skills `token-saver:*` (lecture
      ciblée, sorties courtes, contexte léger).
  plugins:
    - name: token-saver
      skills:
        - name: lecture-ciblee
          content: |
            ---
            name: lecture-ciblee
            description: À appliquer avant de lire un fichier ou de chercher dans le dépôt, pour lire le minimum de tokens (gros YAML, values Helm, README).
            ---
            # Lecture ciblée

            - Localise d'abord avec `grep -n` / `rg -n` (ou `find`), puis lis
              uniquement la plage utile (`Read` avec offset/limit, `sed -n 'A,Bp'`).
            - Ne relis jamais un fichier déjà lu ou que tu viens d'éditer.
            - Pour une version ou un champ précis, `grep -nE 'targetRevision|image:'`
              suffit : n'ouvre pas le manifeste entier.
            - Lance les recherches indépendantes en parallèle, en un seul appel.
            - Évite `cat` sur un fichier > 200 lignes, et ignore `.git`, `node_modules`,
              les fichiers générés et les CRDs.
        - name: sorties-courtes
          content: |
            ---
            name: sorties-courtes
            description: À appliquer avant d'exécuter une commande shell ou kubectl/gh/helm, pour limiter la taille des sorties renvoyées dans le contexte.
            ---
            # Sorties courtes

            - Filtre à la source : `--jq`, `-o jsonpath=`, `-o name`, `--json champ1,champ2`,
              `--limit N`, plutôt que le JSON/YAML complet.
            - Borne les sorties : `| head -n 40`, `| tail -n 30`, `grep -c` pour compter.
            - `kubectl get ... -o yaml` est interdit sans filtre : prends `-o wide`
              ou `jsonpath`. Pour les logs : `--tail=50 --since=10m`.
            - Pour un test ou un lint : n'affiche que les échecs
              (`2>&1 | grep -iE 'error|fail' | head`).
            - Redirige les sorties volumineuses vers `/tmp/x.log` et n'en lis que
              la partie utile.
            - Ne fais pas de `gh issue view` ou `gh pr view` complet si seuls le
              titre, l'état ou un champ sont utiles.
        - name: contexte-leger
          content: |
            ---
            name: contexte-leger
            description: À appliquer pendant une session longue ou une tâche multi-étapes pour garder le contexte petit (réponses concises, délégation, sous-agents).
            ---
            # Contexte léger

            - Réponds brièvement : résultat et décision, sans reformuler la demande
              ni lister des options que tu ne retiens pas.
            - Ne recopie pas de code ou de diff déjà visibles ; cite `fichier:ligne`.
            - Délègue à un sous-agent les explorations larges (plusieurs fichiers)
              et ne garde que sa conclusion.
            - Fais des modifications ciblées (`Edit`), pas de réécriture complète
              d'un fichier.
            - Ne relance pas une vérification déjà faite et ne revérifie pas après
              chaque édition ; une seule validation avant de pousser.
            - Après une grosse tâche terminée, propose `/compact` ou une nouvelle
              Session plutôt que de traîner un long historique.
---
apiVersion: kelos.dev/v1alpha2
kind: Session
metadata:
  name: claude
  namespace: kelos-agents
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # Branche de travail (créée depuis `main` si absente) : jamais `main`.
  initialBranch: claude/kelos-session
  worker:
    type: claude-code
    credentials:
      type: oauth
      secretRef:
        name: claude-oauth-token
    workspaceRef:
      name: agrocd-home
    agentConfigRefs:
      - name: claude-homelab
  # Workspace persistant : historique de la conversation, état de Claude Code
  # et modifications du dépôt survivent au remplacement du pod.
  volumeClaimTemplate:
    accessModes:
      - ReadWriteOnce
    storageClassName: longhorn
    resources:
      requests:
        storage: 10Gi
  # Libère le pod après 1 h d'inactivité (le PVC est conservé) ; la Session
  # reprend dès qu'on la sélectionne dans la Console.
  idlePolicy:
    suspendAfterSeconds: 3600
