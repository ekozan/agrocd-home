# Credentials partagés par les agents de kelos-agents, depuis OpenBao.
#
# Token d'abonnement Claude (Pro/Max), valable 1 an, généré sur un poste où
# Claude Code est connecté :
#   claude setup-token
#   bao kv put -mount=kv kubernetes/kelos/claude oauth_token='sk-ant-oat01-…'
#
# Token GitHub (fine-grained PAT : dépôts choisis ; Contents, Pull requests,
# Issues en lecture/écriture ; Metadata en lecture) :
#   bao kv put -mount=kv kubernetes/kelos/github token='github_pat_…'
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-oauth-token
  namespace: kelos-agents
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: claude-oauth-token
    creationPolicy: Owner
    # `nospace` retire espaces et retours à la ligne : un token copié depuis un
    # terminal est souvent coupé en deux lignes, ce que Claude Code refuse
    # (« Invalid Authorization header value … contains a line break »).
    template:
      engineVersion: v2
      data:
        # Clé attendue par Kelos pour claude-code + credentials.type: oauth
        CLAUDE_CODE_OAUTH_TOKEN: "{{ .oauth_token | nospace }}"
  data:
    - secretKey: oauth_token
      remoteRef:
        key: kubernetes/kelos/claude
        property: oauth_token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-token
  namespace: kelos-agents
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: github-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Clé attendue par les Workspaces (git HTTPS + CLI gh)
        GITHUB_TOKEN: "{{ .token | nospace }}"
  data:
    - secretKey: token
      remoteRef:
        key: kubernetes/kelos/github
        property: token
