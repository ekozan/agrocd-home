# Token de connexion de la Kelos Console (mode staticToken).
# OpenBao : kv/kubernetes/kelos/console, propriété `token`.
#   bao kv put -mount=kv kubernetes/kelos/console token="$(openssl rand -hex 32)"
#
# Wave -1 : le Secret doit exister avant le Deployment de la Console.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kelos-console-auth
  namespace: kelos-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: kelos-console-auth
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: kubernetes/kelos/console
        property: token
