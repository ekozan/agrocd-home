# Kasm Workspaces — plan de contrôle (api, manager, guac, proxy + PostgreSQL
# embarqué). Les sessions (desktops/navigateurs) ne tournent PAS dans le
# cluster : elles sont hébergées par des Docker Agents externes.
# Doc : https://docs.kasm.com/docs/tutorials/install/kubernetes
#
# Multi-source :
#   1. dev/kasm/chart : copie du chart officiel kasm-helm 1.1190.6, patchée pour
#      rendre configurables les ressources des initContainers (cf. README) ;
#   2. dev/kasm/ : Job PreSync qui crée le Secret kasm-secrets une seule fois.
#
# Dimensionné pour UN seul utilisateur : ressources minimales, gateways RDP
# désactivées, un seul processus guacd.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kasm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  destination:
    server: "https://kubernetes.default.svc"
    namespace: kasm
  sources:
    - repoURL: https://github.com/ekozan/agrocd-home.git
      targetRevision: main
      path: dev/kasm/chart
      helm:
        releaseName: kasm
        valuesObject:
          publicAddr: kasm.ffd.link
          deploymentSize: small
          # Résolveur DNS des sidecars nginx. Le chart le déduit via `lookup`,
          # inopérant sous ArgoCD (rendu `helm template`) → il retomberait sur
          # 127.0.0.11 (DNS Docker). On fixe l'IP du Service kube-dns
          # (défaut k3s/RKE2 : 10.43.0.10).
          nginxResolver: 10.43.0.10
          # Exposé uniquement via Traefik (pas de LoadBalancer MetalLB).
          proxyService:
            type: ClusterIP
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              # Protection CrowdSec (bouncer + AppSec)
              traefik.ingress.kubernetes.io/router.middlewares: traefik-crowdsec@kubernetescrd
          certificate:
            # Wildcard *.ffd.link répliqué dans tous les namespaces.
            secretName: ffd-link-tls
            certManager:
              addWildCard: false
          # Le chart génère ses mots de passe avec `lookup` + randAlphaNum :
          # sous ArgoCD ils seraient régénérés à chaque rendu. On utilise un
          # Secret pré-créé une seule fois par dev/kasm/secrets-keygen.yaml.
          kasmSecrets:
            create: false
            name: kasm-secrets
          dbManagement:
            # Le chart supprime le Job db-init après ce délai (défaut 300 s) et
            # ArgoCD (selfHeal) le recréerait aussitôt → délai allongé (~11 j).
            # Max 999999 : au-delà Helm le rend en notation scientifique
            # (3.15e+08), invalide pour l'API. Le Job est idempotent (il
            # vérifie que la base est déjà initialisée et sort).
            initJobTTLSecondsAfterFinished: 999999
          # Ressources : les presets `deploymentSize: small` du chart réservent
          # requests = limits (QoS Guaranteed), soit ~5,75 CPU / ~4,3 Gi. Usage
          # mono-utilisateur → requests au plancher, limits pour les pics.
          initContainerResources:
            requests: { cpu: 5m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          database:
            storage:
              storageClassName: longhorn
            resources:
              requests: { cpu: 25m, memory: 192Mi, ephemeral-storage: 50Mi }
              limits: { cpu: "1", memory: 1Gi, ephemeral-storage: 2Gi }
          components:
            api:
              resources:
                requests: { cpu: 25m, memory: 256Mi, ephemeral-storage: 50Mi }
                limits: { cpu: "1", memory: 1Gi, ephemeral-storage: 2Gi }
            manager:
              resources:
                requests: { cpu: 10m, memory: 192Mi, ephemeral-storage: 50Mi }
                limits: { cpu: 500m, memory: 1Gi, ephemeral-storage: 2Gi }
            proxy:
              resources:
                requests: { cpu: 5m, memory: 64Mi, ephemeral-storage: 50Mi }
                limits: { cpu: 500m, memory: 512Mi, ephemeral-storage: 2Gi }
            guac:
              # Un seul processus guacd (4 par défaut en `small`).
              guacClusterSize: 1
              recordingData:
                storageClassName: longhorn
                pvcSize: 1
              resources:
                requests: { cpu: 5m, memory: 96Mi, ephemeral-storage: 50Mi }
                limits: { cpu: "1", memory: 1Gi, ephemeral-storage: 2Gi }
              nginxSidecar:
                resources:
                  requests: { cpu: 5m, memory: 16Mi }
                  limits: { cpu: 250m, memory: 128Mi }
            # Gateways RDP (accès à des machines Windows/Linux en RDP) : inutiles
            # pour les sessions conteneurs → désactivées.
            rdpGateway:
              enabled: false
            rdpHttpsGateway:
              enabled: false
          imagePullPolicy: IfNotPresent
    - repoURL: https://github.com/ekozan/agrocd-home.git
      targetRevision: main
      path: dev/kasm
  syncPolicy:
    # Pod Security Admission — phase A : inventaire sans blocage (warn + audit)
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        maxDuration: 3m0s
        factor: 2
