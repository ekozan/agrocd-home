# Kasm Workspaces — plan de contrôle (api, manager, guac, rdp-gateway, proxy +
# PostgreSQL embarqué). Les sessions (desktops/navigateurs) ne tournent PAS
# dans le cluster : elles sont hébergées par des Docker Agents externes.
# Doc : https://docs.kasm.com/docs/tutorials/install/kubernetes
#
# Multi-source :
#   1. chart Helm officiel kasm-helm (natif ArgoCD, pas de Kustomize) ;
#   2. dev/kasm/ : Job PreSync qui crée le Secret kasm-secrets une seule fois.
#
# Note : le chart n'expose pas `priorityClassName` → les pods tournent en
# `homelab-standard` (globalDefault).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kasm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  destination:
    server: "https://kubernetes.default.svc"
    namespace: kasm
  sources:
    - chart: kasm-helm
      repoURL: https://helm.kasm.com
      # La version du chart suit celle de Kasm (1.1190.x = Kasm 1.19.0).
      targetRevision: 1.1190.6
      helm:
        releaseName: kasm
        valuesObject:
          publicAddr: kasm.ffd.link
          deploymentSize: small
          # Résolveur DNS des sidecars nginx. Le chart le déduit via `lookup`,
          # inopérant sous ArgoCD (rendu `helm template`) → il retomberait sur
          # 127.0.0.11 (DNS Docker). On fixe l'IP du Service kube-dns
          # (défaut k3s/RKE2 : 10.43.0.10).
          nginxResolver: 10.43.0.10
          # Exposé uniquement via Traefik (pas de LoadBalancer MetalLB).
          proxyService:
            type: ClusterIP
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              # Protection CrowdSec (bouncer + AppSec)
              traefik.ingress.kubernetes.io/router.middlewares: traefik-crowdsec@kubernetescrd
          certificate:
            # Wildcard *.ffd.link répliqué dans tous les namespaces.
            secretName: ffd-link-tls
            certManager:
              addWildCard: false
          # Le chart génère ses mots de passe avec `lookup` + randAlphaNum :
          # sous ArgoCD ils seraient régénérés à chaque rendu. On utilise un
          # Secret pré-créé une seule fois par dev/kasm/secrets-keygen.yaml.
          kasmSecrets:
            create: false
            name: kasm-secrets
          dbManagement:
            # Le chart supprime le Job db-init après ce délai (défaut 300 s) et
            # ArgoCD (selfHeal) le recréerait aussitôt → délai allongé (~11 j).
            # Max 999999 : au-delà Helm le rend en notation scientifique
            # (3.15e+08), invalide pour l'API. Le Job est idempotent (il
            # vérifie que la base est déjà initialisée et sort).
            initJobTTLSecondsAfterFinished: 999999
          # Ressources : les presets `deploymentSize: small` du chart réservent
          # requests = limits (QoS Guaranteed), soit ~5,75 CPU / ~4,3 Gi pour un
          # plan de contrôle quasi inactif en homelab. On réserve le minimum
          # (requests basses) et on garde des limits pour absorber les pics.
          database:
            storage:
              storageClassName: longhorn
            resources:
              requests: { cpu: 100m, memory: 256Mi, ephemeral-storage: 50Mi }
              limits: { cpu: "1", memory: 1Gi, ephemeral-storage: 2Gi }
          components:
            api:
              resources:
                requests: { cpu: 100m, memory: 384Mi, ephemeral-storage: 50Mi }
                limits: { cpu: "1", memory: 1Gi, ephemeral-storage: 2Gi }
            manager:
              resources:
                requests: { cpu: 50m, memory: 256Mi, ephemeral-storage: 50Mi }
                limits: { cpu: 500m, memory: 1Gi, ephemeral-storage: 2Gi }
            proxy:
              resources:
                requests: { cpu: 50m, memory: 128Mi, ephemeral-storage: 50Mi }
                limits: { cpu: 500m, memory: 512Mi, ephemeral-storage: 2Gi }
            guac:
              recordingData:
                storageClassName: longhorn
              resources:
                requests: { cpu: 50m, memory: 256Mi, ephemeral-storage: 50Mi }
                limits: { cpu: "1", memory: 1Gi, ephemeral-storage: 2Gi }
              nginxSidecar:
                resources:
                  requests: { cpu: 10m, memory: 32Mi }
                  limits: { cpu: 250m, memory: 128Mi }
            rdpGateway:
              resources:
                requests: { cpu: 25m, memory: 128Mi, ephemeral-storage: 50Mi }
                limits: { cpu: 500m, memory: 512Mi, ephemeral-storage: 2Gi }
              nginxSidecar:
                resources:
                  requests: { cpu: 10m, memory: 32Mi }
                  limits: { cpu: 250m, memory: 128Mi }
            rdpHttpsGateway:
              resources:
                requests: { cpu: 25m, memory: 128Mi, ephemeral-storage: 50Mi }
                limits: { cpu: 500m, memory: 512Mi, ephemeral-storage: 2Gi }
              nginxSidecar:
                resources:
                  requests: { cpu: 10m, memory: 32Mi }
                  limits: { cpu: 250m, memory: 128Mi }
          imagePullPolicy: IfNotPresent
    - repoURL: https://github.com/ekozan/agrocd-home.git
      targetRevision: main
      path: dev/kasm
  syncPolicy:
    # Pod Security Admission — phase A : inventaire sans blocage (warn + audit)
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        maxDuration: 3m0s
        factor: 2
