# NetBird — INSTANCE DE TEST (netbird2.ffd.link, namespace netbird2) +
# reverse proxy NetBird (*.proxy.ffd.link).
#
# Tourne en parallèle de l'instance de production (release Helm dans le
# namespace `netbird`, netbird.ffd.link), sans la toucher : autre nom
# d'Application, autre namespace, autre hôte. Base de données vierge.
# Bascule en production plus tard : infra/netbird/README.md (« Bascule »).
#
# Manifests bruts dans infra/netbird/ (management, signal, relay, dashboard,
# reverse proxy, ExternalSecrets OpenBao, IngressRoute) ; les tags `image:`
# sont suivis par Renovate.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netbird2
  namespace: argocd
  annotations:
    # Après external-secrets (wave 1) et le store OpenBao (wave 2).
    argocd.argoproj.io/sync-wave: "13"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  source:
    repoURL: https://github.com/ekozan/agrocd-home.git
    targetRevision: HEAD
    path: infra/netbird
  destination:
    server: "https://kubernetes.default.svc"
    namespace: netbird2
  syncPolicy:
    # Pod Security Admission — phase A : inventaire sans blocage (warn + audit)
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        maxDuration: 3m0s
        factor: 2
