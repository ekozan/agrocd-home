# Clé API NetBird de l'opérateur (Personal Access Token d'un service user
# admin) : kv/kubernetes/netbird/operator, propriété api_key.
#
# Wave -1 : le Secret doit exister avant le Deployment de l'opérateur (wave 0).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-mgmt-api-key
  namespace: netbird
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: netbird-mgmt-api-key
    creationPolicy: Owner
  data:
    - secretKey: NB_API_KEY
      remoteRef:
        key: kubernetes/netbird/operator
        property: api_key
