---
# Namespace `komga` : créé en amont par infra/init/ns.yaml (wave -1).
#
# Komga — serveur de médias pour BD / mangas / magazines / eBooks
# (https://komga.org). Application autonome : base embarquée SQLite dans
# /config, aucune dépendance à pg-main. Les livres sont lus depuis un
# partage SMB EXISTANT monté en /data (PV statique, aucun provisionnement) ;
# Komga scanne ce répertoire.
#
# Authentification : comptes locaux Komga + login OIDC Zitadel
# (idp.ffd.link). Pré-requis manuels : voir infra/komga/README.md.
#
# Alimentation de la bibliothèque : pas d'upload de livre par le navigateur.
# L'écran « Import > Books » de l'UI parcourt le SYSTÈME DE FICHIERS DU
# SERVEUR (POST /api/v1/books/import ne prend qu'un chemin `sourceFile`,
# pas un corps de fichier) → déposer les fichiers sur le partage NFS
# (SMB/NFS/rsync côté TrueNAS), Komga les détecte ensuite. Seules les
# vignettes/posters s'envoient en multipart depuis l'UI, et Spring y
# applique ses défauts (1 Mo par fichier) → aucun gros corps de requête.
#
# Priorité : `homelab-low` (la plus basse du cluster — cf.
# init/resource-policies/priorityclasses.yaml). Sous pression mémoire ou
# disque, Komga est donc évincé AVANT tout autre applicatif, et son
# ordonnancement ne préempte jamais un pod déjà placé (`preemptionPolicy:
# Never` porté par la classe). C'est un service de confort : sa perte est
# sans conséquence sur l'infra ou les services critiques.
---
# ExternalSecret — credentials du client OIDC Zitadel (confidentiel).
# Pré-requis OpenBao : kv/kubernetes/komga/zitadel { client_id, client_secret }
# Application OIDC à créer dans Zitadel (code flow + secret), redirect :
#   https://komga.ffd.link/login/oauth2/code/zitadel
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: komga-oidc
  namespace: komga
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: komga-oidc
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: kubernetes/komga/zitadel
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: kubernetes/komga/zitadel
        property: client_secret
---
# PersistentVolumeClaim — base SQLite, index Lucene, miniatures (Longhorn).
# Doit être local/rapide : la base embarquée supporte mal les montages réseau.
# 500 Mo : suffisant pour la base et l'index ; les miniatures grossissent avec
# le catalogue → Longhorn autorise l'expansion à chaud si besoin.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: komga-config
  namespace: komga
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 500Mi
---
# PersistentVolume — bibliothèque : partage SMB DÉJÀ EXISTANT.
#
# Aucun provisionnement : le pilote `node-manual` (déployé par
# infra/04-csi-node-manual.yaml) se contente de monter le partage en cifs.
# Les identifiants viennent du Secret `democratic-csi-smb-creds` déjà présent
# dans le namespace democratic-csi (ExternalSecret OpenBao,
# kv/kubernetes/democratic-csi/smb-credentials, clé `mount_flags` au format
# `username=…,password=…`).
#
# `server` / `share` = partage `\\nas.home\bd-manga`. Non secrets (les
# identifiants, eux, viennent du Secret ci-dessus), d'où leur présence ici.
# `nas.home` doit être résolvable par les nœuds (DNS du LAN) : si la
# résolution échoue côté kubelet, remplacer par l'IP du NAS.
#
# `claimRef` pré-réserve le volume au PVC ci-dessous (aucun autre PVC ne peut
# le capter) ; `Retain` garantit que la suppression du PVC ne touche pas au
# partage existant.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: komga-library
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # Valeur purement déclarative : un partage SMB n'expose pas de quota au CSI.
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: komga
    name: komga-library
  csi:
    driver: org.democratic-csi.node-manual
    readOnly: false
    fsType: cifs
    volumeHandle: komga-library-smb
    nodeStageSecretRef:
      name: democratic-csi-smb-creds
      namespace: democratic-csi
    volumeAttributes:
      server: nas.home
      share: bd-manga
      node_attach_driver: smb
      provisioner_driver: node-manual
---
# PersistentVolumeClaim — se lie au PV statique ci-dessus (storageClassName
# vide + volumeName : pas de provisionnement dynamique).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: komga-library
  namespace: komga
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: komga-library
  resources:
    requests:
      storage: 1Ti
---
# Deployment — Komga (JVM, un seul réplica : PVC config en RWO)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: komga
  namespace: komga
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  # Le PVC de config est RWO : l'ancien pod doit libérer le volume avant que
  # le nouveau démarre (RollingUpdate resterait bloqué en Pending).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: komga
  template:
    metadata:
      labels:
        app: komga
    spec:
      # Priorité la plus faible du cluster : premier évincé sous pression,
      # ne préempte jamais (cf. init/resource-policies/priorityclasses.yaml).
      priorityClassName: homelab-low
      containers:
        - name: komga
          image: gotson/komga:1.26.3
          ports:
            - containerPort: 25600
              name: http
          env:
            - name: SERVER_PORT
              value: "25600"
            - name: TZ
              value: "Europe/Paris"
            # Plafonne le tas JVM sous la limite mémoire du conteneur : sans
            # cela le heap max par défaut (¼ de la RAM du nœud) peut dépasser
            # la limite → OOMKill au lieu d'un GC.
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx1g"
            # ── OIDC (Zitadel) ──────────────────────────────────────────────
            # Komga est un Spring Boot : la config OAuth2 passe par les
            # propriétés `spring.security.oauth2.client.*`. En variables
            # d'environnement, les noms de propriétés s'écrivent SANS
            # séparateur (CLIENTID, ISSUERURI…) : le binding relâché de Spring
            # ne sait pas distinguer `client_id` de `client.id` sinon.
            # `zitadel` est l'identifiant d'enregistrement, repris dans l'URL
            # de callback → https://komga.ffd.link/login/oauth2/code/zitadel
            - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_ZITADEL_ISSUERURI
              value: "https://idp.ffd.link"
            # Komga rapproche l'utilisateur OIDC de son compte par l'e-mail.
            - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_ZITADEL_USERNAMEATTRIBUTE
              value: "email"
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_ZITADEL_PROVIDER
              value: "zitadel"
            # Libellé du bouton sur la page de login.
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_ZITADEL_CLIENTNAME
              value: "FFD Link"
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_ZITADEL_AUTHORIZATIONGRANTTYPE
              value: "authorization_code"
            # {baseUrl} est résolu par Spring d'après les en-têtes
            # X-Forwarded-* de Traefik (Komga active déjà
            # server.forward-headers-strategy=framework par défaut).
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_ZITADEL_REDIRECTURI
              value: "{baseUrl}/login/oauth2/code/{registrationId}"
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_ZITADEL_SCOPE
              value: "openid,profile,email"
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_ZITADEL_CLIENTID
              valueFrom:
                secretKeyRef:
                  name: komga-oidc
                  key: client_id
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_ZITADEL_CLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: komga-oidc
                  key: client_secret
            # Crée automatiquement le compte Komga à la première connexion
            # OIDC (sinon l'e-mail doit déjà exister côté Komga). L'e-mail doit
            # être vérifié dans Zitadel (claim `email_verified`), Komga
            # refusant sinon la connexion (komga.oidc-email-verification).
            - name: KOMGA_OAUTH2_ACCOUNT_CREATION
              value: "true"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: library
              mountPath: /data
          # Komga n'expose pas d'endpoint de santé HTTP non authentifié
          # (les endpoints actuator sont désactivés) → sondes TCP.
          startupProbe:
            tcpSocket:
              port: 25600
            # Démarrage JVM + migrations de la base : jusqu'à 5 min.
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 25600
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 25600
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              # Tas JVM (1 Go) + métaspace/threads/off-heap.
              memory: 1536Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: komga-config
        - name: library
          persistentVolumeClaim:
            claimName: komga-library
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: komga
  namespace: komga
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: komga
  ports:
    - name: http
      port: 25600
      targetPort: 25600
---
# Ingress — komga.ffd.link (protégé CrowdSec)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: komga
  namespace: komga
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Middleware standard (corps entier inspecté) : les seuls envois sont des
    # vignettes (≤ 1 Mo), la bibliothèque étant alimentée par le partage NFS.
    # Pas besoin du variant `crowdsec-largebody` réservé à OxiCloud.
    traefik.ingress.kubernetes.io/router.middlewares: traefik-crowdsec@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: komga.ffd.link
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: komga
                port:
                  number: 25600
  tls:
    - secretName: ffd-link-tls
      hosts:
        - komga.ffd.link
