apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: linphone
  namespace: argocd
  annotations:
    # Après les network-policies (wave 8). Service purement HTTP : il ne dépend
    # que de Traefik et du certificat wildcard `ffd-link-tls` répliqué.
    # Le PBX (FreePBX/Asterisk) est hébergé hors cluster, sur ESXi.
    argocd.argoproj.io/sync-wave: "12"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab

  source:
    repoURL: https://github.com/ekozan/agrocd-home.git
    targetRevision: HEAD
    path: ./infra/linphone

  destination:
    server: https://kubernetes.default.svc
    # Le namespace réel de chaque ressource est porté par le manifest
    # (metadata.namespace = linphone) ; cette valeur n'est qu'un défaut ArgoCD.
    namespace: linphone

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
