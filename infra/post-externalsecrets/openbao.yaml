apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-backend
  namespace: external-secrets
spec:
  provider:
    vault:
      # Accès direct à OpenBao sur TrueNAS, sans passer par openbao.ffd.link :
      # ce nom résout vers l'IP publique (NAT loopback) puis repasse par Traefik
      # dans le cluster. Si Traefik ou le DNS tombent, External Secrets ne peut
      # plus lire aucun secret (dépendance circulaire). Le segment Traefik →
      # TrueNAS était déjà en HTTP clair sur le LAN : pas de régression.
      server: "http://10.10.0.245:14000"
      path: "kv"
      # Version is the Vault KV secret engine version.
      # This can be either "v1" or "v2", defaults to "v2"
      version: "v2"
      auth:
        # points to a secret that contains a vault token
        # https://www.vaultproject.io/docs/auth/token
        tokenSecretRef:
          name: openbao-token
          namespace: external-secrets
          key: token
