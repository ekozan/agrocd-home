apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flexisip
  namespace: argocd
  annotations:
    # Après le provisionnement Linphone (wave 12). Dépend du certificat
    # wildcard `ffd-link-tls` répliqué (wave 3) et, pour le push, des
    # ExternalSecrets (wave 1) — ces derniers sont optionnels.
    argocd.argoproj.io/sync-wave: "13"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab

  source:
    repoURL: https://github.com/ekozan/agrocd-home.git
    targetRevision: HEAD
    path: ./infra/flexisip

  destination:
    server: https://kubernetes.default.svc
    # Le namespace réel de chaque ressource est porté par le manifest
    # (metadata.namespace = flexisip) ; cette valeur n'est qu'un défaut ArgoCD.
    namespace: flexisip

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
