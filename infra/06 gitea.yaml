apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"    
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  destination:
    server: "https://kubernetes.default.svc"
    namespace: gitea
    # Sync policy
  syncPolicy:
    # Pod Security Admission — phase A : inventaire sans blocage (warn + audit)
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
    syncOptions:
      - CreateNamespace=true
    automated: 
      prune: true
      selfHeal: true
  source:
    chart: gitea
    repoURL: https://dl.gitea.com/charts/
    targetRevision: 12.7.0
    helm:
      releaseName: gitea
      valuesObject: 
        ingress:
          enabled: true
          # Protection CrowdSec (bouncer) sur Gitea
          annotations:
            traefik.ingress.kubernetes.io/router.middlewares: traefik-crowdsec@kubernetescrd
          hosts:
            - host: git.ffd.link
              paths:
                - path: /
                  pathType: Prefix
        gitea:
          config:
            server: 
              ROOT_URL: https://git.ffd.link
            # Base sur l'instance CNPG centralisée pg-main (infra/postgres).
            # Rôle/base `gitea`, mot de passe injecté depuis le Secret
            # `gitea-db` (répliqué depuis le ns database).
            database:
              DB_TYPE: postgres
              HOST: pg-main-rw.database.svc:5432
              NAME: gitea
              USER: gitea
              SSL_MODE: require
          additionalConfigFromEnvs:
            - name: GITEA__DATABASE__PASSWD
              valueFrom:
                secretKeyRef:
                  name: gitea-db
                  key: password
        postgresql-ha:
          enabled: false
        # Ancien PostgreSQL embarqué (Bitnami) désactivé : données migrées
        # vers pg-main (infra/postgres/migration/03-gitea.yaml).
        postgresql:
          enabled: false
        valkey-cluster:
          enabled: false
        valkey:
          enabled: true
