apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zitadel
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"    
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  destination:
    server: "https://kubernetes.default.svc"
    namespace: zitadel
    # Sync policy
  syncPolicy:
    # Pod Security Admission — phase A : inventaire sans blocage (warn + audit)
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
    syncOptions:
      - CreateNamespace=true
    automated: 
      prune: true
      selfHeal: true
  source:
    chart: zitadel
    repoURL: https://charts.zitadel.com
    targetRevision: 10.5.*
    helm:
      releaseName: zitadel
      valuesObject:  
        replicaCount: 1
        image:
          # Overrides the image tag whose default is the chart appVersion.
          tag: "v4.20.3"
        login:
          ingress:
            enabled: true
          # Chart 10 : keypair X.509 du login client épinglé via cert-manager
          # (infra/pre-zitadel/login-service-key.yaml). Sans ça, Argo CD (pas de
          # lookup) régénérerait une clé à chaque rendu.
          loginServiceKeySecretName: zitadel-login-service-key
          image:
            # Overrides the image tag whose default is the chart appVersion.
            tag: "v4.20.3"
        zitadel:
          masterkeySecretName: zitadel-masterkey
          configSecretName: zitadel-secrets
          configSecretKey: config-yaml
          configmapConfig:
            ExternalSecure: true
            ExternalDomain: idp.ffd.link
            TLS:
              Enabled: false
            Database:
              Postgres:
                Host: pg-main-rw.database.svc
                Port: 5432
                Database: zitadel
                MaxOpenConns: 20
                MaxIdleConns: 10
                MaxConnLifetime: 30m
                MaxConnIdleTime: 5m
                User:
                  Username: zitadel
                  SSL:
                    Mode: require #verify-ca
                Admin:
                  Username: postgres
                  SSL:
                    Mode: require #verify-ca
        ingress:
          enabled: true
          # Protection CrowdSec (bouncer + AppSec) sur l'IdP Zitadel
          annotations:
            traefik.ingress.kubernetes.io/router.middlewares: traefik-crowdsec@kubernetescrd
          hosts:
            - host: idp.ffd.link
              paths:
                - path: /
                  pathType: Prefix
        extraVolumes:
            - name: ca-certificates
              configMap:
                name: local-ca-bundle
                defaultMode: 0644
                optional: false
                items:
                - key: trust-bundle.pem
                  path: trust-bundle.pem

        extraVolumeMounts:
            - mountPath: /etc/ssl/certs/
              name: ca-certificates
              readOnly: true    
              
        dbSslCaCrtSecret: zitadel-postgresql-tls
