apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: komga
  namespace: argocd
  annotations:
    # Dernière vague : service de confort, sans dépendance forte (pas de base
    # pg-main, pas d'ExternalSecret). Déployé après les network-policies
    # (wave 8) pour que l'ouverture Traefik → komga soit déjà en place, et
    # après les autres applicatifs qui, eux, sont prioritaires.
    argocd.argoproj.io/sync-wave: "13"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab

  source:
    repoURL: https://github.com/ekozan/agrocd-home.git
    targetRevision: HEAD
    path: ./infra/komga

  destination:
    server: https://kubernetes.default.svc
    # Le namespace réel de chaque ressource est porté par le manifest
    # (metadata.namespace = komga) ; cette valeur n'est qu'un défaut ArgoCD.
    namespace: komga

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
