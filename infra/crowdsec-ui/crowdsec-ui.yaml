# UI web locale pour CrowdSec — crowdsec-web-ui (TheDuffman85).
#
# Interface auto-hébergée qui interroge le LAPI (hébergé sur le pare-feu
# OPNsense, 10.5.0.1:8080) pour les alertes, décisions,
# métriques) via un compte machine. AUCUNE donnée n'est envoyée à un SaaS
# (contrairement à l'enrôlement Console). L'appli n'embarque PAS d'auth : elle
# est exposée derrière Traefik et protégée par les middlewares `crowdsec`
# (bouncer + AppSec) et `local-only` (réseaux LAN uniquement).
#
# Connexion au LAPI : compte machine `crowdsec-web-ui`. Le Job
# `crowdsec-ui-register` génère UNE FOIS un mot de passe stable dans le Secret
# crowdsec-web-ui-credentials (render déterministe, pas de churn sous selfHeal).
# Le LAPI étant hors cluster, la machine est déclarée une fois sur l'OPNsense
# avec ce mot de passe (cscli machines add crowdsec-web-ui --password …, cf.
# README « CrowdSec — LAPI sur OPNsense »).
---
# Compte de service du Job d'enregistrement de la machine
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crowdsec-ui-register
  namespace: crowdsec
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# Droits : gérer le Secret credentials
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crowdsec-ui-register
  namespace: crowdsec
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crowdsec-ui-register
  namespace: crowdsec
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crowdsec-ui-register
subjects:
  - kind: ServiceAccount
    name: crowdsec-ui-register
    namespace: crowdsec
---
# Job de génération (une seule fois) du mot de passe machine de l'UI.
# Ressource NORMALE en wave 1 (PAS un hook PostSync) : ArgoCD attend qu'elle
# soit Complete avant d'appliquer le Deployment (wave 2), garantissant que le
# Secret crowdsec-web-ui-credentials existe AVANT que le pod UI le monte. Un
# hook PostSync provoquerait un interblocage (le Deployment ne devient jamais
# Healthy sans le Secret → le hook ne se déclenche jamais). Même schéma que le
# Job crowdsec-lapi-secret-gen. Force/Replace : le Job est immuable, on le
# remplace à chaque sync (idempotent : mot de passe stable réutilisé).
#
# ⚠️ PAS de ttlSecondsAfterFinished ici. Une ressource NORMALE (non-hook) est
# comparée au dépôt Git par ArgoCD : si le TTL controller supprime le Job une
# fois terminé, l'application passe OutOfSync (ressource Missing) et selfHeal le
# recrée aussitôt → le Job se relance en boucle toutes les ~10 min, pour
# toujours. Le Job terminé est donc conservé (objet unique, réutilisé) ; il est
# relancé uniquement lors d'une vraie sync grâce à Force/Replace. Le Job
# crowdsec-bouncer-register peut, lui, garder un TTL car c'est un hook PostSync
# (les hooks sont exclus du diff ArgoCD).
apiVersion: batch/v1
kind: Job
metadata:
  name: crowdsec-ui-register
  namespace: crowdsec
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 5
  template:
    spec:
      serviceAccountName: crowdsec-ui-register
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: register
          image: alpine/kubectl:1.36.3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # HOME inscriptible pour le cache kubectl (rootfs en lecture seule)
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              # Mot de passe STABLE : généré une seule fois, jamais rotationné
              if kubectl -n crowdsec get secret crowdsec-web-ui-credentials >/dev/null 2>&1; then
                echo "Secret crowdsec-web-ui-credentials déjà présent — rien à faire."
                exit 0
              fi
              PW=$(head -c 96 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 48)
              kubectl -n crowdsec create secret generic crowdsec-web-ui-credentials \
                --from-literal=password="${PW}"
              echo "Mot de passe UI généré (stable)."
              # Le LAPI (OPNsense) doit porter CE mot de passe : à déclarer une
              # fois sur le pare-feu, sinon l'UI prend des 403.
              echo "Sur l'OPNsense : cscli machines add crowdsec-web-ui --password <crowdsec/crowdsec-web-ui-credentials:password> --force -f /dev/null"
      volumes:
        - name: tmp
          emptyDir: {}
---
# Persistance du cache SQLite de l'UI (alertes/décisions historisées sous
# /app/data). Sa perte n'est pas critique (re-sync depuis le LAPI) mais évite un
# rechargement complet à chaque redémarrage du pod.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crowdsec-web-ui-data
  namespace: crowdsec
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowdsec-web-ui
  namespace: crowdsec
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crowdsec-web-ui
  strategy:
    # Volume RWO (Longhorn) → éviter deux pods montant le même PVC pendant un roll
    type: Recreate
  template:
    metadata:
      labels:
        app: crowdsec-web-ui
    spec:
      # L'image tourne en utilisateur non-root `node` (UID 1000) ; fsGroup pour
      # que le volume Longhorn (/app/data) soit inscriptible.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: crowdsec-web-ui
          image: ghcr.io/theduffman85/crowdsec-web-ui:2026.7.17
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            # LAPI hébergé sur le pare-feu OPNsense
            - name: CROWDSEC_URL
              value: http://10.5.0.1:8080
            - name: CROWDSEC_USER
              value: crowdsec-web-ui
            - name: CROWDSEC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crowdsec-web-ui-credentials
                  key: password
            - name: PORT
              value: "3000"
            - name: DB_DIR
              value: /app/data
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: crowdsec-web-ui-data
---
apiVersion: v1
kind: Service
metadata:
  name: crowdsec-web-ui
  namespace: crowdsec
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: crowdsec-web-ui
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
# Ingress crowdsec.ffd.link — l'UI n'a pas d'auth intégrée : on la restreint au
# LAN (local-only) en plus du bouncer CrowdSec. Cert wildcard *.ffd.link
# (ffd-link-tls) répliqué dans tous les namespaces par kubernetes-replicator.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crowdsec-web-ui
  namespace: crowdsec
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # CrowdSec (bouncer + AppSec) + accès LAN uniquement
    traefik.ingress.kubernetes.io/router.middlewares: traefik-crowdsec@kubernetescrd,traefik-local-only@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: crowdsec.ffd.link
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crowdsec-web-ui
                port:
                  number: 3000
  tls:
    - secretName: ffd-link-tls
      hosts:
        - crowdsec.ffd.link
---
# Le namespace crowdsec applique un default-deny-ingress (cf.
# infra/network-policies/crowdsec.yaml). L'allow existant n'ouvre que l'AppSec
# (7422) ; on autorise donc explicitement les pods Traefik à joindre l'UI
# sur le port 3000, sinon l'Ingress renverrait un 502.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-web-ui
  namespace: crowdsec
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  podSelector:
    matchLabels:
      app: crowdsec-web-ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 3000
