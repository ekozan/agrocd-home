# UI web locale pour CrowdSec — crowdsec-web-ui (TheDuffman85).
#
# Interface auto-hébergée qui interroge le LAPI (hébergé sur le pare-feu
# OPNsense, 10.5.0.1:8080) pour les alertes, décisions,
# métriques) via un compte machine. AUCUNE donnée n'est envoyée à un SaaS
# (contrairement à l'enrôlement Console). L'appli n'embarque PAS d'auth : elle
# est exposée derrière Traefik et protégée par les middlewares `crowdsec`
# (bouncer) et `local-only` (réseaux LAN uniquement).
# Accès distant : crowdsec.proxy.ffd.link (reverse proxy NetBird, SSO Zitadel ;
# cf. infra/netbird/README.md « Services exposés »).
#
# Connexion au LAPI : compte machine `crowdsec-web-ui`, déclaré UNE FOIS sur
# l'OPNsense (`cscli machines add crowdsec-web-ui --password '<ui_password>'`).
# Le mot de passe vit dans OpenBao (kv/kubernetes/crowdsec/opnsense, propriété
# `ui_password`) et est synchronisé par external-secrets dans le Secret
# crowdsec-web-ui-machine. Plus de Job d'enregistrement.
---
# Mot de passe du compte machine `crowdsec-web-ui` sur le LAPI (OPNsense).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-web-ui-machine
  namespace: crowdsec
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: crowdsec-web-ui-machine
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: kubernetes/crowdsec/opnsense
        property: ui_password
---
# Persistance du cache SQLite de l'UI (alertes/décisions historisées sous
# /app/data). Sa perte n'est pas critique (re-sync depuis le LAPI) mais évite un
# rechargement complet à chaque redémarrage du pod.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crowdsec-web-ui-data
  namespace: crowdsec
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowdsec-web-ui
  namespace: crowdsec
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crowdsec-web-ui
  strategy:
    # Volume RWO (Longhorn) → éviter deux pods montant le même PVC pendant un roll
    type: Recreate
  template:
    metadata:
      labels:
        app: crowdsec-web-ui
    spec:
      # L'image tourne en utilisateur non-root `node` (UID 1000) ; fsGroup pour
      # que le volume Longhorn (/app/data) soit inscriptible.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: crowdsec-web-ui
          image: ghcr.io/theduffman85/crowdsec-web-ui:2026.11.12
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            # LAPI hébergé sur le pare-feu OPNsense
            - name: CROWDSEC_URL
              value: http://10.5.0.1:8080
            - name: CROWDSEC_USER
              value: crowdsec-web-ui
            - name: CROWDSEC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crowdsec-web-ui-machine
                  key: password
            - name: PORT
              value: "3000"
            - name: DB_DIR
              value: /app/data
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: crowdsec-web-ui-data
---
apiVersion: v1
kind: Service
metadata:
  name: crowdsec-web-ui
  namespace: crowdsec
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: crowdsec-web-ui
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
# Ingress crowdsec.ffd.link — l'UI n'a pas d'auth intégrée : on la restreint au
# LAN (local-only) en plus du bouncer CrowdSec. Cert wildcard *.ffd.link
# (ffd-link-tls) répliqué dans tous les namespaces par kubernetes-replicator.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crowdsec-web-ui
  namespace: crowdsec
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Accès LAN uniquement (local-only) : pas de bouncer CrowdSec sur ce service,
    # il n'est pas joignable depuis Internet.
    traefik.ingress.kubernetes.io/router.middlewares: traefik-local-only@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: crowdsec.ffd.link
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crowdsec-web-ui
                port:
                  number: 3000
  tls:
    - secretName: ffd-link-tls
      hosts:
        - crowdsec.ffd.link
---
# Le namespace crowdsec applique un default-deny-ingress (cf.
# infra/network-policies/crowdsec.yaml) ; on autorise donc explicitement les
# pods Traefik à joindre l'UI
# sur le port 3000, sinon l'Ingress renverrait un 502.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-web-ui
  namespace: crowdsec
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  podSelector:
    matchLabels:
      app: crowdsec-web-ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 3000
---
# Accès via le reverse proxy NetBird (crowdsec.proxy.ffd.link) : le proxy
# (cible « Proxy Cluster », service NetBird-Only) ou le routing peer (cible
# « Resource », service public) joignent l'UI depuis le namespace netbird.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-netbird-to-web-ui
  namespace: crowdsec
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  podSelector:
    matchLabels:
      app: crowdsec-web-ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: netbird
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["netbird-proxy", "netbird-router"]
      ports:
        - protocol: TCP
          port: 3000
