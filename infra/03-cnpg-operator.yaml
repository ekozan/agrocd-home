apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  destination:
    server: "https://kubernetes.default.svc"
    namespace: cnpg-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      # Les CRD CloudNativePG sont volumineuses : Server-Side Apply évite
      # l'erreur "metadata.annotations: Too long" du last-applied-configuration.
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
  source:
    chart: cloudnative-pg
    repoURL: https://cloudnative-pg.github.io/charts
    targetRevision: 0.28.3
    helm:
      releaseName: cnpg
      valuesObject:
        crds:
          create: true
        config:
          clusterWide: true
        # Au démarrage, l'opérateur (clusterWide) charge en cache les objets de
        # tous les namespaces : après une panne/resync complète du cluster le pic
        # dépasse 256Mi → OOMKilled en boucle. 1Gi laisse une marge confortable.
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
