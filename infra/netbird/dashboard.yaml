# NetBird dashboard (UI web, login OIDC Zitadel en PKCE).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-dashboard
  namespace: netbird
  labels:
    app.kubernetes.io/name: netbird-dashboard
    app.kubernetes.io/instance: netbird
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: netbird-dashboard
      app.kubernetes.io/instance: netbird
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbird-dashboard
        app.kubernetes.io/instance: netbird
    spec:
      automountServiceAccountToken: false
      containers:
        - name: dashboard
          # Versionné à part (v2.x), indépendamment du management.
          image: netbirdio/dashboard:v2.94.0
          imagePullPolicy: IfNotPresent
          env:
            - name: AUTH_AUTHORITY
              value: https://idp.ffd.link
            - name: AUTH_REDIRECT_URI
              value: /auth
            - name: AUTH_SILENT_REDIRECT_URI
              value: /silent-auth
            - name: AUTH_SUPPORTED_SCOPES
              value: openid profile email offline_access api groups
            - name: NETBIRD_MGMT_API_ENDPOINT
              value: https://netbird.ffd.link:443
            - name: NETBIRD_MGMT_GRPC_API_ENDPOINT
              value: https://netbird.ffd.link:443
            - name: USE_AUTH0
              value: "false"
            # Client ID de l'app NetBird dans Zitadel
            - name: AUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: netbird
                  key: idpClientID
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: netbird-dashboard
  namespace: netbird
  labels:
    app.kubernetes.io/name: netbird-dashboard
    app.kubernetes.io/instance: netbird
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: netbird-dashboard
    app.kubernetes.io/instance: netbird
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
