# Secrets NetBird, sourcés depuis OpenBao (ClusterSecretStore openbao-backend).
# Voir infra/netbird/README.md pour les remplir (depuis le management.json
# actuel pour le Secret `netbird`, puis token du proxy + clé bouncer).
#
# Wave -1 : les Secrets doivent exister avant les Deployments (wave 0), et la
# ConfigMap du management n'a plus que des placeholders à la place des secrets. Tant
# qu'un ExternalSecret n'est pas Ready (chemin OpenBao absent ou incomplet), la
# sync s'arrête à cette vague et le reste de l'app n'est pas modifié.
---
# Secret `netbird` : variables d'environnement du management, du relay et du
# dashboard. S'il existe déjà (créé à la main), ESO le reprend : il
# devient propriétaire et écrase seulement les clés ci-dessous.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird
  namespace: netbird
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: netbird
    creationPolicy: Owner
  data:
    # Clé de chiffrement de la base SQLite : DOIT rester la valeur actuelle,
    # sinon les données chiffrées du management deviennent illisibles.
    - secretKey: datastoreEncryptionKey
      remoteRef:
        key: kubernetes/netbird/server
        property: datastore_encryption_key
    # Client ID de l'app NetBird dans Zitadel (dashboard).
    - secretKey: idpClientID
      remoteRef:
        key: kubernetes/netbird/server
        property: idp_client_id
    # Secret du service user Zitadel `netbird@idp.ffd.link` (IdpManagerConfig).
    - secretKey: idpServiceUserSecret
      remoteRef:
        key: kubernetes/netbird/server
        property: idp_service_user_secret
    # Secret partagé management ↔ relay.
    - secretKey: relayPassword
      remoteRef:
        key: kubernetes/netbird/server
        property: relay_password
    # Mot de passe de l'utilisateur `coturn` sur turn.ffd.link.
    - secretKey: turnServerPassword
      remoteRef:
        key: kubernetes/netbird/server
        property: turn_server_password
---
# Secret du reverse proxy (infra/netbird/proxy.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-proxy-token
  namespace: netbird
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: netbird-proxy-token
    creationPolicy: Owner
  data:
    # Token d'accès du proxy au management (nbx_…, 40 caractères — pas le
    # Token ID) : `netbird-mgmt admin token create`.
    - secretKey: token
      remoteRef:
        key: kubernetes/netbird/proxy
        property: token
    # Clé du bouncer `netbird-proxy` sur le LAPI CrowdSec (OPNsense) :
    # `cscli bouncers add netbird-proxy -o raw`.
    - secretKey: crowdsec
      remoteRef:
        key: kubernetes/netbird/proxy
        property: crowdsec_api_key
