apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: freepbx
  namespace: argocd
  annotations:
    # Après les network-policies (wave 8) et les autres applicatifs : FreePBX
    # dépend d'external-secrets (wave 1) pour les mots de passe MariaDB, du
    # certificat wildcard `ffd-link-tls` répliqué (wave 3) pour le SIP/TLS et
    # du CSI TrueNAS (wave 4) pour ses PVC.
    argocd.argoproj.io/sync-wave: "12"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab

  source:
    repoURL: https://github.com/ekozan/agrocd-home.git
    targetRevision: HEAD
    path: ./infra/freepbx

  destination:
    server: https://kubernetes.default.svc
    # Le namespace réel de chaque ressource est porté par le manifest
    # (metadata.namespace = freepbx) ; cette valeur n'est qu'un défaut ArgoCD.
    namespace: freepbx

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
