# DÉSACTIVÉ TEMPORAIREMENT (Application Degraded). Pour réactiver : remettre ce fichier
# dans infra/ (git mv infra/disabled/09-crowdsec-ui.yaml infra/09-crowdsec-ui.yaml).
# Le finalizer supprime les ressources de infra/crowdsec-ui/ (dont le PVC de 1 Gi,
# non critique). Avant de réactiver : renseigner `ui_password` dans OpenBao
# (kv/kubernetes/crowdsec/opnsense) et déclarer la machine sur l'OPNsense
# (cf. README « Protection CrowdSec »).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crowdsec-ui
  namespace: argocd
  annotations:
    # Après les network-policies (wave 8) ; le moteur CrowdSec (LAPI) provient
    # de la couche init.
    argocd.argoproj.io/sync-wave: "9"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab

  source:
    repoURL: https://github.com/ekozan/agrocd-home.git
    targetRevision: HEAD
    path: ./infra/crowdsec-ui

  destination:
    server: https://kubernetes.default.svc
    # Le namespace réel de chaque ressource est porté par le manifest
    # (metadata.namespace = crowdsec) ; cette valeur n'est qu'un défaut ArgoCD.
    namespace: crowdsec

  # Sync policy
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
