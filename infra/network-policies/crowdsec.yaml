---
# default-deny ingress : aucune connexion entrante par défaut dans crowdsec.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: crowdsec
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Trafic intra-namespace autorisé (UI, agents).
# Le LAPI (:8080) est hébergé sur le pare-feu OPNsense, hors cluster ; le
# bouncer (plugin dans les pods Traefik) n'appelle plus rien dans ce namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: crowdsec
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
