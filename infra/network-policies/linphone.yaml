---
# default-deny ingress dans le namespace linphone.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: linphone
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Traefik → serveur de provisionnement Linphone (linphone.ffd.link).
# Seul flux entrant légitime : le PBX est hors cluster et n'initie jamais de
# connexion vers ce namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik
  namespace: linphone
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8080
