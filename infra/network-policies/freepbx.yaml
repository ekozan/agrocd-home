---
# default-deny ingress dans le namespace freepbx.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: freepbx
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Trafic intra-namespace autorisé (izPBX → MariaDB).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: freepbx
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
# Traefik → interface d'administration FreePBX (pbx.ffd.link) et serveur de
# provisionnement Linphone (pbx.ffd.link/provisioning).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik
  namespace: freepbx
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
---
# Postes SIP du LAN → izPBX : signalisation (5060 UDP/TCP, 5061 TLS) et média
# RTP/SRTP (10000-10019/UDP, plage publiée par le Service `freepbx-sip`).
#
# Le Service LoadBalancer est en externalTrafficPolicy=Local : l'IP source du
# client est préservée, ces ipBlock voient donc la vraie adresse du poste.
#
# Ouverture à Internet (softphones en mobilité) : ajouter une policy dédiée
# avec `ipBlock: 0.0.0.0/0` limitée au 5061 (TLS) et à la plage RTP — jamais
# le 5060 en clair, qui est balayé en permanence par les robots SIP. Voir
# infra/freepbx/README.md § « Exposer le SIP à l'extérieur ».
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sip-from-lan
  namespace: freepbx
spec:
  podSelector:
    matchLabels:
      app: freepbx
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.10.0.0/16
        - ipBlock:
            cidr: 10.5.0.0/16
      ports:
        - protocol: UDP
          port: 5060
        - protocol: TCP
          port: 5060
        - protocol: TCP
          port: 5061
        - protocol: UDP
          port: 10000
          endPort: 10019
