---
# Namespace `euro-office` : créé en amont par infra/init/ns.yaml (wave -1).
# ExternalSecret — JWT_SECRET du serveur de documents Euro-Office.
# MÊME valeur que OxiCloud OXICLOUD_WOPI_SECRET (OpenBao kv/kubernetes/office/jwt)
# afin que les jetons signés par OxiCloud soient acceptés par Euro-Office.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: euro-office-jwt
  namespace: euro-office
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: euro-office-jwt
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: kubernetes/office/jwt
        property: secret
---
# Deployment — Euro-Office Document Server (fork OnlyOffice).
# Pas de PVC : les documents vivent dans OxiCloud ; le répertoire de données de
# l'image (/var/lib/euro-office) est déjà inscriptible. Monter un volume vide
# par-dessus masquerait le contenu pré-généré de l'image (fonts/App_Data).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: euro-office
  namespace: euro-office
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate            # services internes (rabbitmq/redis) → pas de rollout //
  selector:
    matchLabels:
      app: euro-office
  template:
    metadata:
      labels:
        app: euro-office
    spec:
      initContainers:
        # L'entrypoint ne crée le schéma DB que pour le postgres EMBARQUÉ
        # (DB_HOST=localhost), PAS pour une base externe. On charge donc le
        # schéma Euro-Office/OnlyOffice dans la base `euro-office` (pg-main) s'il
        # est absent. Idempotent : createdb.sql n'est appliqué que si la table
        # doc_changes n'existe pas. Sans ça docservice logue « DB table
        # doc_changes does not exist », ne bind pas son port → nginx 502 → CrashLoop.
        - name: db-schema
          image: ghcr.io/euro-office/documentserver:v9.3.2
          command:
            - /bin/bash
            - -c
            - |
              set -eu
              export PGPASSWORD="$DB_PWD"
              CONN="host=pg-main-rw.database.svc.cluster.local port=5432 dbname=euro-office user=euro-office sslmode=disable connect_timeout=10"
              if psql "$CONN" -tAc "select to_regclass('public.doc_changes')" | grep -q doc_changes; then
                echo "Schéma déjà présent — rien à faire."
              else
                F=$(find / -path '*schema/postgresql/createdb.sql' 2>/dev/null | head -1)
                echo "Application du schéma: $F"
                psql "$CONN" -v ON_ERROR_STOP=1 -f "$F"
                echo "Schéma appliqué."
              fi
          env:
            - name: DB_PWD
              valueFrom:
                secretKeyRef:
                  name: euro-office-db
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      containers:
        - name: documentserver
          image: ghcr.io/euro-office/documentserver:v9.3.2
          ports:
            - containerPort: 80
              name: http
          env:
            # Protection JWT des requêtes vers/depuis le document server.
            - name: JWT_ENABLED
              value: "true"
            - name: JWT_HEADER
              value: "Authorization"
            - name: JWT_IN_BODY
              value: "true"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: euro-office-jwt
                  key: JWT_SECRET
            # ── WOPI (intégration OxiCloud) ──────────────────────────────────
            # Désactivé par défaut dans l'image : sans WOPI_ENABLED le serveur
            # ne publie pas /hosting/discovery (404) et OxiCloud ne peut pas
            # découvrir l'éditeur. ALLOW_PRIVATE_IP_ADDRESS autorise les
            # rappels WOPI (CheckFileInfo/GetFile/PutFile) vers l'IP cluster
            # d'OxiCloud, que le request-filtering-agent bloque par défaut.
            - name: WOPI_ENABLED
              value: "true"
            - name: ALLOW_PRIVATE_IP_ADDRESS
              value: "true"
            # ── Base de données externe : pg-main (CNPG) ─────────────────────
            # Renseigner DB_* désactive le PostgreSQL embarqué de l'image.
            # RabbitMQ et Redis restent embarqués (non déportés).
            # Connexion SANS TLS : le support SSL d'OnlyOffice vers une PG
            # externe est non fiable ; pg-main accepte le non-SSL (règle `host`
            # du pg_hba CNPG). Trafic intra-cluster + NetworkPolicy.
            - name: DB_TYPE
              value: "postgres"
            - name: DB_HOST
              value: "pg-main-rw.database.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "euro-office"
            - name: DB_USER
              value: "euro-office"
            - name: DB_PWD
              valueFrom:
                secretKeyRef:
                  name: euro-office-db
                  key: password
          # Démarrage lent (génération polices/thèmes ~90 s). Le startupProbe
          # laisse jusqu'à ~5 min avant que readiness/liveness prennent le relais
          # → évite les kills en boucle pendant l'initialisation.
          startupProbe:
            httpGet:
              path: /healthcheck
              port: 80
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
            periodSeconds: 30
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: euro-office
  namespace: euro-office
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: euro-office
  ports:
    - name: http
      port: 80
      targetPort: 80
---
# Ingress — office.ffd.link (protégé CrowdSec)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: euro-office
  namespace: euro-office
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: traefik-crowdsec@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: office.ffd.link
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: euro-office
                port:
                  number: 80
  tls:
    - secretName: ffd-link-tls
      hosts:
        - office.ffd.link
